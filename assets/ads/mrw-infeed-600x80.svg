<svg viewBox="0 0 600 80" width="600" height="80" xmlns="http://www.w3.org/2000/svg" font-family="'DM Sans', Arial, sans-serif">
  <!-- Hintergrund -->
  <rect width="600" height="80" fill="#16181f" rx="10"/>
  <!-- Rahmen gestrichelt -->
  <rect width="600" height="80" fill="none" stroke="rgba(232,150,58,0.25)" stroke-width="1" stroke-dasharray="4,4" rx="10"/>
  <!-- Linker Akzentstreifen -->
  <rect x="0" y="0" width="3" height="80" fill="#e8963a" rx="3"/>

  <!-- Reifen-Icon -->
  <g transform="translate(44,40)">
    <circle cx="0" cy="0" r="22" fill="none" stroke="#e8963a" stroke-width="3"/>
    <circle cx="0" cy="0" r="13" fill="none" stroke="#e8963a" stroke-width="2"/>
    <circle cx="0" cy="0" r="4"  fill="#e8963a"/>
    <line x1="0" y1="-13" x2="0"  y2="-22" stroke="#e8963a" stroke-width="2" stroke-linecap="round"/>
    <line x1="0"  y1="13" x2="0"  y2="22"  stroke="#e8963a" stroke-width="2" stroke-linecap="round"/>
    <line x1="-13" y1="0" x2="-22" y2="0"  stroke="#e8963a" stroke-width="2" stroke-linecap="round"/>
    <line x1="13"  y1="0" x2="22"  y2="0"  stroke="#e8963a" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Trennlinie -->
  <line x1="80" y1="16" x2="80" y2="64" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>

  <!-- Text -->
  <text x="96" y="30" fill="#f1f2f4" font-size="14" font-weight="700" font-family="'Syne', Arial, sans-serif">Mobiler Reifenwechsel</text>
  <text x="96" y="48" fill="#9ca3af" font-size="11">Reifen wechseln lassen – direkt bei Ihnen vor Ort.</text>
  <text x="96" y="63" fill="#6b7280" font-size="10">📍 Nürnberg · Fürth · Erlangen    ☎ 0151 61428880</text>

  <!-- CTA -->
  <rect x="456" y="22" width="120" height="36" rx="8" fill="#e8963a"/>
  <text x="516" y="45" text-anchor="middle" fill="#0e0f13" font-size="12" font-weight="700">Termin →</text>

  <!-- Anzeige-Label -->
  <text x="590" y="11" text-anchor="end" fill="rgba(107,114,128,0.5)" font-size="8" letter-spacing="0.08em">ANZEIGE</text>
</svg>
