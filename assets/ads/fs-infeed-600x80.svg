<svg viewBox="0 0 600 80" width="600" height="80" xmlns="http://www.w3.org/2000/svg" font-family="'DM Sans', Arial, sans-serif">
  <defs>
    <linearGradient id="fsGoldI" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4B96A"/>
      <stop offset="50%" stop-color="#C9A84C"/>
      <stop offset="100%" stop-color="#9A7C2C"/>
    </linearGradient>
  </defs>

  <!-- Hintergrund -->
  <rect width="600" height="80" fill="#0a0a0a" rx="10"/>
  <!-- Goldener Rahmen gestrichelt -->
  <rect width="600" height="80" fill="none" stroke="rgba(201,168,76,0.3)" stroke-width="1" stroke-dasharray="4,4" rx="10"/>
  <!-- Goldener Akzent-Streifen links -->
  <rect x="0" y="0" width="3" height="80" fill="url(#fsGoldI)" rx="3"/>

  <!-- Logo (links) -->
  <image href="Logo%20Fotographie%20Silva%2090x76.png" x="10" y="8" width="64" height="64" preserveAspectRatio="xMidYMid meet"/>

  <!-- Trennlinie -->
  <line x1="85" y1="14" x2="85" y2="66" stroke="rgba(201,168,76,0.2)" stroke-width="1"/>

  <!-- Name + Tagline (Mitte-Links) -->
  <text x="97" y="26" fill="#C9A84C" font-size="10" letter-spacing="2.5" font-family="Georgia, serif">FOTOGRAFIE</text>
  <text x="97" y="44" fill="url(#fsGoldI)" font-size="17" letter-spacing="2" font-family="Georgia, serif" font-weight="700">SILVIKA</text>
  <text x="97" y="61" fill="#9ca3af" font-size="9.5" font-style="italic">Professionelle Fotografie · Nürnberg &amp; Umgebung</text>

  <!-- Trennlinie -->
  <line x1="308" y1="14" x2="308" y2="66" stroke="rgba(201,168,76,0.15)" stroke-width="1"/>

  <!-- Services (kompakt, 3 Zeilen) -->
  <text x="320" y="27" fill="#d1d5db" font-size="10">📸 Events &amp; Partys</text>
  <text x="320" y="45" fill="#d1d5db" font-size="10">💍 Hochzeiten</text>
  <text x="320" y="63" fill="#d1d5db" font-size="10">🪞 Portrait &amp; Beauty</text>

  <!-- Trennlinie -->
  <line x1="446" y1="14" x2="446" y2="66" stroke="rgba(201,168,76,0.15)" stroke-width="1"/>

  <!-- CTA Button (ganz rechts, klar getrennt) -->
  <rect x="456" y="20" width="130" height="38" rx="8" fill="url(#fsGoldI)"/>
  <text x="521" y="44" text-anchor="middle" fill="#0a0a0a" font-size="12" font-weight="700">Anfragen →</text>

  <!-- ANZEIGE -->
  <text x="592" y="10" text-anchor="end" fill="rgba(107,114,128,0.5)" font-size="8" letter-spacing="0.08em">ANZEIGE</text>
</svg>
